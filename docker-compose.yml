version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nema_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nema_db}
    ports:
      - "5432:5432"
    volumes:
      - nema_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  nema_pg_data:
